name: PowerFlow
options:
  bundleIdPrefix: com.powerflow
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""

targets:
  PowerFlow:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/PowerFlow
      - path: Resources
        buildPhase: none
        excludes:
          - AppIcon.icon
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - sdk: IOKit.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.powerflow.app
        PRODUCT_NAME: PowerFlow
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/PowerFlow.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  PowerFlowTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/PowerFlowTests
    dependencies:
      - target: PowerFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.powerflow.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PowerFlow.app/Contents/MacOS/PowerFlow"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  PowerFlow:
    build:
      targets:
        PowerFlow: all
        PowerFlowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PowerFlowTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
